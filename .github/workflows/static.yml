name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '7 23 24 11 *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Choose what to publish
        id: launch
        shell: bash
        run: |
          launch=$(date -u -d '2026-11-24 23:00:00 UTC' +%s)
          if [ "$(date -u +%s)" -lt "$launch" ]; then
            if [ ! -f .github/launch/index.html ]; then
              echo "Nedräkningsfilen saknas: .github/launch/index.html"
              exit 1
            fi
            echo "path=.github/launch" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.launch.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
